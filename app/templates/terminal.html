<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackheart — Terminal</title>
<link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml">
<style>
  html,body{margin:0;height:100%;background:#0a0a0c;color:#e9e4d6;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #termFrame{border:0;width:100vw;height:100vh;display:block;background:#000}
  #termMsg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    text-align:center;padding:40px}
  #termMsg .box{max-width:560px;border:1px solid #2a2a2f;background:#141416;
    border-radius:8px;padding:26px 30px}
  #termMsg h2{margin:0 0 10px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#e11d2a}
  #termMsg code{background:#060608;border:1px solid #1f1f23;border-radius:5px;padding:2px 6px;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#e9e4d6}
  #termMsg p{color:#a6a196;line-height:1.6}
</style>
</head>
<body>
  <iframe id="termFrame" title="Blackheart tmux (2x2)"></iframe>
  <div id="termMsg"><div class="box">
    <h2>Terminal unavailable</h2>
    <p id="termMsgText">Checking dependencies…</p>
  </div></div>
<script>
  window.TTYD_URL = {{ ttyd_url | tojson }};
</script>
<script src="{{ url_for('static', filename='js/terminal.js') }}"></script>
</body>
</html>
