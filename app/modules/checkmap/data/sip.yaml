        text: Register-hijack an extension to intercept calls
        manual: true
        commands: |
          # with a cracked/open ext, REGISTER your endpoint to receive its calls
      - id: eavesdrop
        text: Capture + reconstruct RTP audio (if on-path)
        manual: true
        commands: |
          # wireshark: Telephony > VoIP Calls > Play  (or rtpbreak / sipdump)
      - id: toll_fraud
        text: Note toll-fraud / INVITE abuse surface
        manual: true
